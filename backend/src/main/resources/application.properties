# ─────────────────────────────────────────────
# NexaCRM AI — Spring Boot Application Config
# ─────────────────────────────────────────────

spring.application.name=nexacrm-ai
# Load local .env values when running from backend/ or project root.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── Server ──────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Database (MongoDB Atlas) ───────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin:123@internitecrm.t9xvmx7.mongodb.net/nexacrm?retryWrites=true&w=majority}
spring.data.mongodb.database=${MONGODB_DB:nexacrm}

# ── MongoDB ──────────────────────────────────
# Disabled so live data with historical duplicates does not block application startup.
spring.data.mongodb.auto-index-creation=false

# ── Jackson ───────────────────────────────────
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata

# ── JWT ──────────────────────────────────────
jwt.secret=${JWT_SECRET:replace-with-a-64-char-minimum-secret-before-production}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── CORS ─────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://nexacrmai.com,https://www.nexacrmai.com}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,X-Webhook-Token,X-WhatsApp-Webhook-Token,X-Hub-Signature-256,X-Call-Agent-Secret}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# ── Auth cookies (HttpOnly JWT) ─────────────────
auth.cookie.access.name=${AUTH_COOKIE_ACCESS_NAME:access_token}
auth.cookie.refresh.name=${AUTH_COOKIE_REFRESH_NAME:refresh_token}
auth.cookie.access.max-age-seconds=${AUTH_COOKIE_ACCESS_MAX_AGE_SECONDS:86400}
auth.cookie.refresh.max-age-seconds=${AUTH_COOKIE_REFRESH_MAX_AGE_SECONDS:604800}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}

# ── OpenAI ───────────────────────────────────
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.max-tokens=${OPENAI_MAX_TOKENS:1500}

# ── Email (SMTP) ──────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

# ── AWS S3 ────────────────────────────────────
aws.s3.access-key=${AWS_ACCESS_KEY:your-access-key}
aws.s3.secret-key=${AWS_SECRET_KEY:your-secret-key}
aws.s3.bucket=${AWS_BUCKET:nexacrm-files}
aws.s3.region=${AWS_REGION:ap-south-1}

# ── Cloudinary ────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# ── Meta (Facebook/Instagram) ─────────────────
meta.app-id=${META_APP_ID:your-meta-app-id}
meta.app-secret=${META_APP_SECRET:your-meta-app-secret}
meta.webhook-token=${META_WEBHOOK_TOKEN:your-webhook-verify-token}
meta.page-access-token=${META_PAGE_ACCESS_TOKEN:your-page-access-token}
meta.page-id=${META_PAGE_ID:}
meta.graph-api-version=v25.0
meta.facebook.out-of-window.retry-with-message-tag=${META_FB_OUT_OF_WINDOW_RETRY_WITH_TAG:false}
meta.facebook.message-tag=${META_FB_MESSAGE_TAG:HUMAN_AGENT}
nexacrm.facebook.live-sync.enabled=${FACEBOOK_LIVE_SYNC_ENABLED:false}
nexacrm.facebook.live-sync.fixed-delay-ms=${FACEBOOK_LIVE_SYNC_DELAY_MS:60000}
nexacrm.facebook.live-sync.include-archived=${FACEBOOK_LIVE_SYNC_INCLUDE_ARCHIVED:true}
nexacrm.facebook.live-sync.lead-page-size=${FACEBOOK_LIVE_SYNC_LEAD_PAGE_SIZE:100}

# ── WhatsApp Business Cloud API ───────────────
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:your-phone-number-id}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:your-access-token}
whatsapp.api-version=v19.0
nexacrm.whatsapp.webhook-token=${WHATSAPP_WEBHOOK_TOKEN:${META_WEBHOOK_TOKEN:}}
nexacrm.whatsapp.aiadrika-base-url=${AIADRIKA_BASE_URL:https://aiadrika.in/api/send}
nexacrm.whatsapp.aiadrika.instance-id=${AIADRIKA_INSTANCE_ID:}
nexacrm.whatsapp.aiadrika.access-token=${AIADRIKA_ACCESS_TOKEN:}
nexacrm.whatsapp.openwa.api-url=${OPENWA_API_URL:http://localhost:2785/api}
nexacrm.whatsapp.openwa.api-key=${OPENWA_API_KEY:owa_k1_3dd7f106e224ad4e438075dee300c7f664c5d2106779d2058eb3d4792d6037eb}
nexacrm.whatsapp.aknexus.api-url=${AKNEXUS_API_URL:https://app.aknexus.in/api/v2}
nexacrm.whatsapp.aknexus.api-token=${AKNEXUS_API_TOKEN:}
nexacrm.whatsapp.aknexus.instance-id=${AKNEXUS_INSTANCE_ID:}
nexacrm.auto-reply.enabled=${AUTO_REPLY_ENABLED:true}
nexacrm.auto-reply.message=${AUTO_REPLY_MESSAGE:Thanks for messaging NexaCRM! We received your message and will get back to you shortly.}
nexacrm.call-agent.enabled=${CALL_AGENT_ENABLED:false}
nexacrm.call-agent.auto-call-on-lead-create=${CALL_AGENT_AUTO_ON_LEAD_CREATE:false}
nexacrm.call-agent.webhook-url=${CALL_AGENT_WEBHOOK_URL:}
nexacrm.call-agent.api-key=${CALL_AGENT_API_KEY:}
nexacrm.call-agent.agent-id=${CALL_AGENT_AGENT_ID:}
nexacrm.call-agent.from-number=${CALL_AGENT_FROM_NUMBER:}
nexacrm.call-agent.timeout-ms=${CALL_AGENT_TIMEOUT_MS:12000}
nexacrm.call-agent.provider=${CALL_AGENT_PROVIDER:bolna}
nexacrm.call-agent.bolna.api-url=${CALL_AGENT_BOLNA_API_URL:https://api.bolna.ai}
nexacrm.call-agent.bolna.api-key=${CALL_AGENT_BOLNA_API_KEY:}
nexacrm.call-agent.bolna.agent-id=${CALL_AGENT_BOLNA_AGENT_ID:8a7fd58e-cb41-4588-8e0e-2c1899addb83}
nexacrm.call-agent.bolna.voice-id=${CALL_AGENT_BOLNA_VOICE_ID:}
nexacrm.call-agent.callback-webhook-url=${CALL_AGENT_CALLBACK_WEBHOOK_URL:}
nexacrm.call-agent.webhook-secret=${CALL_AGENT_WEBHOOK_SECRET:}

# ── Twilio Integration ──────────────────────────────────────────
nexacrm.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
nexacrm.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
nexacrm.twilio.phone-numbers=${TWILIO_PHONE_NUMBERS:}
nexacrm.twilio.default-from-number=${TWILIO_DEFAULT_FROM_NUMBER:}

# ── Redis Cache ───────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2000}
spring.data.redis.lettuce.shutdown-timeout=${REDIS_SHUTDOWN_TIMEOUT:200ms}
spring.cache.type=${CACHE_TYPE:redis}
nexacrm.cache.dashboard-ttl-seconds=${DASHBOARD_CACHE_TTL:30}
nexacrm.cache.pipeline-board-ttl-seconds=${PIPELINE_BOARD_CACHE_TTL:10}
nexacrm.cache.leads-list-ttl-seconds=${LEADS_LIST_CACHE_TTL:15}

# ── Actuator ──────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.endpoint.health.group.render.include=ping
management.endpoint.health.group.render.show-details=never

# ── Logging ───────────────────────────────────
logging.level.com.nexacrm=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# ── File Upload ───────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ── Multi-tenant ──────────────────────────────
nexacrm.multi-tenant.enabled=true
nexacrm.default-tenant=default
